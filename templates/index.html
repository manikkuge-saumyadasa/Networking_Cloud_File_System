<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudFS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  background: #f5f5f5;
  color: #222;
  min-height: 100vh;
}

/* ── Layout ── */
.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 16px 64px;
}

h1 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 4px;
}

.subtitle {
  color: #888;
  font-size: 12px;
  margin-bottom: 28px;
}

/* ── Card ── */
.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 16px;
}

.card-title {
  font-weight: 600;
  margin-bottom: 12px;
}

/* ── Screen toggle ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── Form elements ── */
input[type="text"] {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
}
input[type="text"]:focus { border-color: #555; }

.row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.row input { flex: 1; }

/* ── Buttons ── */
button {
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  padding: 9px 16px;
  white-space: nowrap;
  transition: background 0.1s;
}

.btn-primary   { background: #222; color: #fff; }
.btn-primary:hover { background: #444; }

.btn-secondary { background: #eee; color: #333; border: 1px solid #ccc; }
.btn-secondary:hover { background: #e0e0e0; }

.btn-danger    { background: #fff; color: #c00; border: 1px solid #f5c0c0; }
.btn-danger:hover { background: #fff0f0; }

.btn-small { padding: 5px 10px; font-size: 12px; }

/* ── User list ── */
.user-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }

.user-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  cursor: pointer;
  background: #fafafa;
}
.user-row:hover { background: #f0f0f0; border-color: #bbb; }

.user-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #222;
  color: #fff;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.divider {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin: 14px 0;
  position: relative;
}
.divider::before, .divider::after {
  content: '';
  position: absolute;
  top: 50%; width: 42%;
  height: 1px; background: #ddd;
}
.divider::before { left: 0; }
.divider::after  { right: 0; }

/* ── Top bar (file screen) ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 8px;
  flex-wrap: wrap;
}

.topbar-left { font-weight: 600; font-size: 15px; }
.topbar-right { display: flex; gap: 6px; }

/* ── Breadcrumb ── */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 8px 12px;
  margin-bottom: 12px;
  font-size: 13px;
}

.breadcrumb a {
  color: #444;
  text-decoration: none;
  cursor: pointer;
}
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { color: #bbb; }
.breadcrumb .current { color: #222; font-weight: 600; }

/* ── Toolbar ── */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

/* ── Progress ── */
.progress-wrap { margin-bottom: 12px; display: none; }
.progress-track { height: 4px; background: #eee; border-radius: 2px; overflow: hidden; margin-top: 4px; }
.progress-bar { height: 100%; background: #222; border-radius: 2px; width: 0%; transition: width 0.2s; }
.progress-label { font-size: 12px; color: #777; }


.file-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid #e8e8e8;
  color: #666;
  font-weight: 600;
  font-size: 12px;
}

.file-table td {
  padding: 9px 10px;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}

.file-table tr:last-child td { border-bottom: none; }
.file-table tr:hover td { background: #fafafa; }

.item-name {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.item-icon { font-size: 16px; flex-shrink: 0; }


.item-name-text {
  font-weight: 500;
  white-space: normal;        /* allow wrapping */
  word-break: break-word;     /* break long words */
  overflow-wrap: anywhere;    /* handle very long filenames */
  max-width: 280px;
}

.dir-name { color: #1a6fc4; }
.dir-name:hover { text-decoration: underline; }

.actions { display: flex; gap: 4px; }

.empty {
  text-align: center;
  padding: 32px;
  color: #aaa;
  font-size: 13px;
}

/* ── Text diagram ── */
.tree-diagram {
  margin: 0;
  white-space: pre;
  overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  line-height: 1.45;
  color: #333;
  background: #fafafa;
  border: 1px solid #ececec;
  border-radius: 6px;
  padding: 12px;
}

/* ── Info bar ── */
.infobar {
  font-size: 12px;
  color: #888;
  margin-bottom: 8px;
}

/* ── Modal ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-bg.open { display: flex; }

.modal {
  background: #fff;
  border-radius: 8px;
  padding: 24px;
  width: 360px;
  max-width: 95vw;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}

.modal h3 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }

.modal input { margin-bottom: 12px; }

.modal select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 12px;
  background: #fff;
}

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: #222;
  color: #fff;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 200;
  max-width: 300px;
}
#toast.show { opacity: 1; }
#toast.err { background: #c00; }

/* ── Logged-in header ── */
.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.user-info .badge {
  background: #222;
  color: #fff;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
}

.user-info .logout {
  font-size: 12px;
  color: #888;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  text-decoration: underline;
}
.user-info .logout:hover { color: #c00; }

@media (max-width: 480px) {
  .item-name-text { max-width: 140px; }
  .file-table th:nth-child(2),
  .file-table td:nth-child(2),
  .file-table th:nth-child(3),
  .file-table td:nth-child(3) { display: none; }
}
</style>
</head>
<body>
<div class="page">

  <h1>☁️ Cloud Storage System - Nilesh Saumyadasa</h1>
  <div class="subtitle">CSC474/574 Programming Assignment</div>

  <!-- ── LOGIN ── -->
  <div id="screen-login" class="screen active">
    <div class="card">
      <div class="card-title">Sign in or create account</div>
      <div class="row">
        <input type="text" id="login-input" placeholder="Username Type here..."
               maxlength="32" autocomplete="off"
               onkeydown="if(event.key==='Enter') doLogin()" />
        <button class="btn-primary" onclick="doLogin()">Enter</button>
      </div>
      <div style="font-size:12px;color:#888">New usernames are created automatically.</div>

      <div id="users-wrap" style="display:none">
        <div class="divider">or choose existing user</div>
        <div class="user-list" id="user-list"></div>
      </div>
    </div>
  </div>

  <!-- ── FILES ── -->
  <div id="screen-files" class="screen">

    <div class="user-info">
      <span class="badge" id="user-badge">—</span>
      <button class="logout" onclick="doLogout()">Log out</button>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn-secondary" onclick="openMkdir()">+ New Folder</button>
      <button class="btn-secondary" onclick="document.getElementById('file-input').click()">↑ Upload Files</button>
      <input type="file" id="file-input" multiple style="display:none" onchange="doUpload(this.files)" />
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label" id="progress-label">Uploading...</div>
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <!-- Info bar -->
    <div class="infobar" id="infobar"></div>

    <!-- File table -->
    <div class="card" style="padding:0;overflow:hidden">
      <table class="file-table" id="file-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Size</th>
            <th>Modified</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="file-body">
          <tr><td colspan="4" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-title">Folder/File Text Diagram</div>
      <pre class="tree-diagram" id="tree-diagram">Loading diagram...</pre>
    </div>
  </div>

</div>

<!-- ── Modals ── -->

<!-- New Folder -->
<div class="modal-bg" id="modal-mkdir">
  <div class="modal">
    <h3>New Folder</h3>
    <input type="text" id="mkdir-name" placeholder="Folder name"
           onkeydown="if(event.key==='Enter') confirmMkdir()" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-mkdir')">Cancel</button>
      <button class="btn-primary" onclick="confirmMkdir()">Create</button>
    </div>
  </div>
</div>

<!-- Move -->
<div class="modal-bg" id="modal-move">
  <div class="modal">
    <h3>Move "<span id="move-name-label"></span>"</h3>
    <label style="font-size:12px;color:#666;display:block;margin-bottom:6px">Destination folder</label>
    <select id="move-select"></select>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-move')">Cancel</button>
      <button class="btn-primary" onclick="confirmMove()">Move</button>
    </div>
  </div>
</div>

<!-- Rename -->
<div class="modal-bg" id="modal-rename">
  <div class="modal">
    <h3>Rename</h3>
    <input type="text" id="rename-input" placeholder="New name"
           onkeydown="if(event.key==='Enter') confirmRename()" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-rename')">Cancel</button>
      <button class="btn-primary" onclick="confirmRename()">Rename</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let currentUser = null;
let currentPath = '/';
let allDirs = ['/'];
let moveTarget = null;   // { path, name, type }
let renameTarget = null;

// ── Toast ─────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, isErr = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3000);
}

// ── Screen ────────────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── Load users ────────────────────────────────────────────────────────────
async function loadUserList() {
  try {
    const r = await fetch('/api/users');
    const d = await r.json();
    const wrap = document.getElementById('users-wrap');
    const list = document.getElementById('user-list');
    if (!d.users.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    list.innerHTML = d.users.map(u => `
      <div class="user-row" onclick="selectUser('${esc(u)}')">
        <div class="user-avatar">${u[0].toUpperCase()}</div>
        <span>${esc(u)}</span>
        <span style="margin-left:auto;color:#bbb;font-size:12px">→</span>
      </div>`).join('');
  } catch {}
}

// ── Login ─────────────────────────────────────────────────────────────────
async function doLogin() {
  const name = document.getElementById('login-input').value.trim();
  if (!name) return;
  await selectUser(name);
}

async function selectUser(name) {
  try {
    const r = await fetch('/api/users', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: name})
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error, true); return; }
    currentUser = name;
    currentPath = '/';
    document.getElementById('user-badge').textContent = name;
    toast(d.message);
    show('files');
    loadDir('/');
  } catch { toast('Cannot connect to server', true); }
}

function doLogout() {
  currentUser = null;
  currentPath = '/';
  document.getElementById('login-input').value = '';
  document.getElementById('tree-diagram').textContent = 'Log in to view folder diagram.';
  show('login');
  loadUserList();
}

// ── Load directory ────────────────────────────────────────────────────────
async function loadDir(path) {
  currentPath = path;
  try {
    const r = await fetch(`/api/list/${currentUser}?path=${encodeURIComponent(path)}`);
    const d = await r.json();
    if (!r.ok) { toast(d.error, true); return; }

    allDirs = d.all_dirs || ['/'];
    renderBreadcrumb(d.breadcrumbs);
    renderTable(d.dirs, d.files);
    loadTreeDiagram(path);
    document.getElementById('infobar').textContent =
      `${d.total_files} file${d.total_files !== 1 ? 's' : ''} · ${d.total_size}` +
      (d.dirs.length ? ` · ${d.dirs.length} folder${d.dirs.length !== 1 ? 's' : ''}` : '');
  } catch { toast('Failed to load directory', true); }
}

async function loadTreeDiagram(path) {
  const el = document.getElementById('tree-diagram');
  el.textContent = 'Loading diagram...';
  try {
    const r = await fetch(`/api/tree/${currentUser}?path=${encodeURIComponent(path)}`);
    const d = await r.json();
    if (!r.ok) {
      el.textContent = d.error || 'Unable to load diagram';
      return;
    }
    el.textContent = d.diagram || '(empty folder)';
  } catch {
    el.textContent = 'Unable to load diagram';
  }
}

// ── Breadcrumb ────────────────────────────────────────────────────────────
function renderBreadcrumb(crumbs) {
  const el = document.getElementById('breadcrumb');
  el.innerHTML = crumbs.map((c, i) => {
    const isLast = i === crumbs.length - 1;
    const sep = i > 0 ? '<span class="sep"> / </span>' : '';
    if (isLast) return `${sep}<span class="current">${esc(c.name)}</span>`;
    return `${sep}<a onclick="loadDir('${esc(c.path)}')">${esc(c.name)}</a>`;
  }).join('');
}

// ── Render table ──────────────────────────────────────────────────────────
function renderTable(dirs, files) {
  const tbody = document.getElementById('file-body');

  if (!dirs.length && !files.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">This folder is empty</td></tr>';
    return;
  }

  // Parent dir row (if not root)
  let rows = '';
  if (currentPath !== '/') {
    const parentPath = currentPath.split('/').slice(0, -1).join('/') || '/';
    rows += `<tr>
      <td><div class="item-name" onclick="loadDir('${esc(parentPath)}')">
        <span class="item-icon">📁</span>
        <span class="item-name-text dir-name">.. (go up)</span>
      </div></td>
      <td>—</td><td>—</td><td></td></tr>`;
  }

  // Directories
  for (const d of dirs) {
    const dpath = (currentPath === '/' ? '' : currentPath) + '/' + d.name;
    rows += `<tr>
      <td><div class="item-name" onclick="loadDir('${esc(dpath)}')">
        <span class="item-icon">📁</span>
        <span class="item-name-text dir-name">${esc(d.name)}</span>
      </div></td>
      <td style="color:#aaa">—</td>
      <td style="color:#aaa">${esc(d.modified)}</td>
      <td><div class="actions">
        <button class="btn-secondary btn-small" onclick="openRename('${esc(dpath)}','${esc(d.name)}')">Rename</button>
        <button class="btn-secondary btn-small" onclick="openMove('${esc(dpath)}','${esc(d.name)}','dir')">Move</button>
        <button class="btn-danger btn-small" onclick="doDelete('${esc(dpath)}','${esc(d.name)}')">Delete</button>
      </div></td></tr>`;
  }

  // Files
  for (const f of files) {
    const fpath = (currentPath === '/' ? '' : currentPath) + '/' + f.name;
    const dlUrl = `/api/download/${currentUser}?path=${encodeURIComponent(fpath)}`;
    rows += `<tr>
      <td><div class="item-name">
        <span class="item-icon">${fileIcon(f.ext)}</span>
        <span class="item-name-text">${esc(f.name)}</span>
      </div></td>
      <td style="color:#666">${esc(f.size_fmt)}</td>
      <td style="color:#aaa">${esc(f.modified)}</td>
      <td><div class="actions">
        <a href="${dlUrl}" download style="text-decoration:none">
          <button class="btn-secondary btn-small">Download</button>
        </a>
        <button class="btn-secondary btn-small" onclick="openRename('${esc(fpath)}','${esc(f.name)}')">Rename</button>
        <button class="btn-secondary btn-small" onclick="openMove('${esc(fpath)}','${esc(f.name)}','file')">Move</button>
        <button class="btn-danger btn-small" onclick="doDelete('${esc(fpath)}','${esc(f.name)}')">Delete</button>
      </div></td></tr>`;
  }

  tbody.innerHTML = rows;
}

function fileIcon(ext) {
  const map = {
    PDF:'📄', DOC:'📝', DOCX:'📝', TXT:'📄',
    JPG:'🖼️', JPEG:'🖼️', PNG:'🖼️', GIF:'🖼️', SVG:'🖼️',
    MP3:'🎵', WAV:'🎵', MP4:'🎬', MOV:'🎬',
    ZIP:'📦', RAR:'📦', GZ:'📦',
    PY:'💻', JS:'💻', HTML:'💻', CSS:'💻', JSON:'💻', C:'💻', CPP:'💻', H:'💻',
    XLS:'📊', XLSX:'📊', CSV:'📊'
  };
  return map[ext] || '📄';
}

// ── Upload ────────────────────────────────────────────────────────────────
async function doUpload(files) {
  if (!files || !files.length) return;

  const pw   = document.getElementById('progress-wrap');
  const pb   = document.getElementById('progress-bar');
  const pl   = document.getElementById('progress-label');

  const form = new FormData();
  form.append('path', currentPath);
  for (const f of files) form.append('file', f);

  pw.style.display = 'block';
  pb.style.width = '5%';
  pl.textContent = `Uploading ${files.length} file(s)…`;

  try {
    const result = await new Promise((res, rej) => {
      const xhr = new XMLHttpRequest();
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) pb.style.width = (e.loaded / e.total * 90) + '%';
      };
      xhr.onload = () => res(JSON.parse(xhr.responseText));
      xhr.onerror = rej;
      xhr.open('POST', `/api/upload/${currentUser}`);
      xhr.send(form);
    });

    pb.style.width = '100%';
    if (result.error) toast(result.error, true);
    else { toast(result.message); loadDir(currentPath); }
  } catch { toast('Upload failed', true); }
  finally {
    setTimeout(() => {
      pw.style.display = 'none';
      pb.style.width = '0%';
      document.getElementById('file-input').value = '';
    }, 700);
  }
}

// ── Delete ────────────────────────────────────────────────────────────────
async function doDelete(path, name) {
  if (!confirm(`Delete "${name}"?\nFolders will be deleted with all their contents.`)) return;
  try {
    const r = await fetch(`/api/delete/${currentUser}`, {
      method: 'DELETE',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({path})
    });
    const d = await r.json();
    if (r.ok) { toast(d.message); loadDir(currentPath); }
    else toast(d.error, true);
  } catch { toast('Delete failed', true); }
}

// ── New folder ────────────────────────────────────────────────────────────
function openMkdir() {
  document.getElementById('mkdir-name').value = '';
  openModal('modal-mkdir');
  setTimeout(() => document.getElementById('mkdir-name').focus(), 100);
}

async function confirmMkdir() {
  const name = document.getElementById('mkdir-name').value.trim();
  if (!name) return;
  closeModal('modal-mkdir');
  try {
    const r = await fetch(`/api/mkdir/${currentUser}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({path: currentPath, name})
    });
    const d = await r.json();
    if (r.ok) { toast(d.message); loadDir(currentPath); }
    else toast(d.error, true);
  } catch { toast('Failed to create folder', true); }
}

// ── Move ──────────────────────────────────────────────────────────────────
function openMove(path, name, type) {
  moveTarget = {path, name, type};
  document.getElementById('move-name-label').textContent = name;

  const sel = document.getElementById('move-select');
  // Build options: all dirs except the item's own parent and (if dir) itself/subtree
  const parentPath = path.split('/').slice(0, -1).join('/') || '/';
  const opts = allDirs.filter(d => {
    if (d === parentPath) return false; // already here
    if (type === 'dir' && (d === path || d.startsWith(path + '/'))) return false;
    return true;
  });

  sel.innerHTML = opts.map(d =>
    `<option value="${esc(d)}">${d === '/' ? '/ (Home)' : d}</option>`
  ).join('');
  openModal('modal-move');
}

async function confirmMove() {
  const dst = document.getElementById('move-select').value;
  closeModal('modal-move');
  if (!moveTarget) return;
  try {
    const r = await fetch(`/api/move/${currentUser}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({src: moveTarget.path, dst})
    });
    const d = await r.json();
    if (r.ok) { toast(d.message); loadDir(currentPath); }
    else toast(d.error, true);
  } catch { toast('Move failed', true); }
}

// ── Rename ────────────────────────────────────────────────────────────────
function openRename(path, name) {
  renameTarget = {path, name};
  document.getElementById('rename-input').value = name;
  openModal('modal-rename');
  setTimeout(() => document.getElementById('rename-input').select(), 100);
}

async function confirmRename() {
  const newName = document.getElementById('rename-input').value.trim();
  closeModal('modal-rename');
  if (!renameTarget || !newName || newName === renameTarget.name) return;
  try {
    const r = await fetch(`/api/rename/${currentUser}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({path: renameTarget.path, name: newName})
    });
    const d = await r.json();
    if (r.ok) { toast(d.message); loadDir(currentPath); }
    else toast(d.error, true);
  } catch { toast('Rename failed', true); }
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ── Init ──────────────────────────────────────────────────────────────────
loadUserList();
</script>
</body>
</html>
